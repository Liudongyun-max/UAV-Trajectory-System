# GRU Baseline Configuration
name: gru_baseline

# Model config
model:
  input_dim: 8
  hidden_dim: 32
  num_layers: 1
  future_steps: 5
  dropout: 0.1

# Training config
training:
  batch_size: 64
  learning_rate: 0.001
  epochs: 100
  cls_weight: 1.0
  reg_weight: 0.5
  grad_clip: 1.0
  patience: 15
  num_workers: 0
  pin_memory: true

# Data config
data:
  root_dir: "F:/UAV Trajectory System/export/input/run004"
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  split_by: episode_id
  negative_ratio: 0.3
  seq_len: 20
  normalize: true
  smooth: true
  smooth_window: 5
  smooth_polyorder: 2

# Export config
export:
  format: pth
  input_dim: 8
  seq_len: 20

# Other
seed: 42
device: auto
log_dir: logs
